<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="discG" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2a2115"/>
      <stop offset="55%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#f6e27a"/>
    </linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d354"/>
      <stop offset="100%" stop-color="#e0a92e"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
    <path id="topArc" d="M 60 200 A 140 140 0 0 1 340 200" fill="none"/>
    <path id="botArc" d="M 66 200 A 134 134 0 0 0 334 200" fill="none"/>
  </defs>

  <!-- outer disc -->
  <circle cx="200" cy="200" r="196" fill="#0d0a07"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldRing)" stroke-width="7"/>
  <circle cx="200" cy="200" r="176" fill="url(#discG)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-dasharray="1.5 7" opacity="0.8"/>

  <!-- top brand text -->
  <text font-family="Cairo, sans-serif" font-weight="700" fill="#e9c85a" letter-spacing="4"
        font-size="26" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">MIGO • NATURAL HONEY</textPath>
  </text>
  <!-- bottom arabic -->
  <text font-family="Cairo, sans-serif" font-weight="700" fill="#e9c85a" letter-spacing="1"
        font-size="24" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%">عسل ميغو الطبيعي</textPath>
  </text>
  <!-- side diamonds -->
  <path d="M 44 200 l 9 -9 l 9 9 l -9 9 z" fill="#d4af37"/>
  <path d="M 338 200 l 9 -9 l 9 9 l -9 9 z" fill="#d4af37"/>

  <!-- ===== BEE ===== -->
  <g transform="translate(200,205)">
    <!-- wings -->
    <g opacity="0.85">
      <ellipse cx="-46" cy="-22" rx="52" ry="30" fill="#e8ecf0" opacity="0.55" transform="rotate(-24 -46 -22)" stroke="#cfd6dd" stroke-width="1"/>
      <ellipse cx="46" cy="-22" rx="52" ry="30" fill="#e8ecf0" opacity="0.55" transform="rotate(24 46 -22)" stroke="#cfd6dd" stroke-width="1"/>
      <ellipse cx="-40" cy="12" rx="40" ry="22" fill="#e8ecf0" opacity="0.45" transform="rotate(-32 -40 12)" stroke="#cfd6dd" stroke-width="1"/>
      <ellipse cx="40" cy="12" rx="40" ry="22" fill="#e8ecf0" opacity="0.45" transform="rotate(32 40 12)" stroke="#cfd6dd" stroke-width="1"/>
    </g>
    <!-- antennae -->
    <path d="M -10 -74 q -16 -22 -30 -30" stroke="#241a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 -74 q 16 -22 30 -30" stroke="#241a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="-42" cy="-106" r="6" fill="#e0a92e"/>
    <circle cx="42" cy="-106" r="6" fill="#e0a92e"/>
    <!-- head -->
    <circle cx="0" cy="-60" r="26" fill="#241a10"/>
    <circle cx="-9" cy="-62" r="6.5" fill="#fff"/><circle cx="-9" cy="-62" r="3" fill="#111"/>
    <circle cx="9" cy="-62" r="6.5" fill="#fff"/><circle cx="9" cy="-62" r="3" fill="#111"/>
    <!-- thorax -->
    <ellipse cx="0" cy="-18" rx="34" ry="30" fill="url(#beeBody)"/>
    <ellipse cx="0" cy="-18" rx="34" ry="30" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.5"/>
    <!-- abdomen striped -->
    <g>
      <path d="M -30 5 Q 0 -2 30 5 L 26 30 Q 0 36 -26 30 Z" fill="#f7d354"/>
      <path d="M -26 30 Q 0 36 26 30 L 22 54 Q 0 60 -22 54 Z" fill="#241a10"/>
      <path d="M -22 54 Q 0 60 22 54 L 18 76 Q 0 82 -18 76 Z" fill="#f7d354"/>
      <path d="M -18 76 Q 0 82 18 76 L 13 96 Q 0 101 -13 96 Z" fill="#241a10"/>
      <path d="M -13 96 Q 0 101 13 96 L 9 112 Q 0 116 -9 112 Z" fill="#f7d354"/>
    </g>
    <!-- honey drop -->
    <path d="M 0 118 C 14 138 20 150 20 160 a 20 20 0 1 1 -40 0 c 0 -10 6 -22 20 -42 Z" fill="url(#drop)"/>
    <ellipse cx="-6" cy="158" rx="5" ry="8" fill="#ffe9a8" opacity="0.7"/>
  </g>
</svg>
